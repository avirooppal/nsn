[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosleepnet"
version = "0.3.0"
description = "Cognitive Memory Operating System for SLMs & AI Agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "numpy>=1.24.0",
    "spacy>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
]
langchain = [
    "langchain-core>=0.1.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "langchain-core>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/avirooppal/nsn"
Repository = "https://github.com/avirooppal/nsn"
