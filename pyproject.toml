[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurosleepnet"
version = "0.2.0"
description = "Cognitive Memory Operating System for SLMs & AI Agents"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pyyaml>=6.0",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "spacy>=3.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
