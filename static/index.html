<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroSleepNet Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-container">
                <div class="pulse-ring"></div>
                <div class="logo"></div>
                <h1>NeuroSleepNet</h1>
            </div>
            <div class="header-actions">
                <!-- NSN handles everything automatically -->
            </div>
        </header>

        <main class="chat-container">
            <div id="chat-box" class="chat-box">
                <div class="message system-msg">
                    <div class="msg-content">Welcome! I am powered by Nemotron and have persistent memory thanks to NeuroSleepNet.</div>
                </div>
            </div>
        </main>

        <footer class="chat-input-container">
            <form id="chat-form">
                <input type="text" id="user-input" placeholder="Type a message..." autocomplete="off" required>
                <button type="submit" id="send-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </footer>
    </div>
    
    <div id="toast-container"></div>

    <script src="/static/script.js"></script>
</body>
</html>
